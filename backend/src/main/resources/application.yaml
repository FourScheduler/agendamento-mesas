spring:
  application:
    name: agendamento-mesas
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agendamento_mesas}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed

server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
  jwt:
    # Segredo APENAS de desenvolvimento; sobrescreva com JWT_SECRET fora de dev (mínimo 32 caracteres para HS256).
    secret: ${JWT_SECRET:chave-desenvolvimento-agendamento-mesas-2026-00000000}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
