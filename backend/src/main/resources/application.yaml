spring:
  application:
    name: agendamento-mesas
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agendamento_mesas}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 10m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4201}
  jwt:
    secret: ${JWT_SECRET:chave-desenvolvimento-agendamento-mesas-2026-00000000}
    expiracao-horas: ${JWT_EXPIRACAO_HORAS:8}
  microsoft:
    enabled: ${MICROSOFT_SSO_ENABLED:false}
    tenant-id: ${MICROSOFT_TENANT_ID:}
    client-id: ${MICROSOFT_CLIENT_ID:}
    client-secret: ${MICROSOFT_CLIENT_SECRET:}
    redirect-uri: ${MICROSOFT_SSO_REDIRECT_URI:http://localhost:4201/api/auth/sso/retorno/microsoft}
