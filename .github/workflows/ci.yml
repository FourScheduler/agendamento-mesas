name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testes-ci
          MYSQL_DATABASE: agendamento_mesas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestes-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testar e empacotar backend
        env:
          TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/agendamento_mesas_test?serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false
          TEST_MYSQL_USERNAME: root
          TEST_MYSQL_PASSWORD: testes-ci
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build do frontend
        run: npm run build

      - name: Testar frontend
        run: npm test -- --watch=false
