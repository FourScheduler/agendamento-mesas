@if (mensagem()) {
  <aside class="notificacao" [class.notificacao--sucesso]="tipo() === 'sucesso'"
    [class.notificacao--erro]="tipo() === 'erro'" [attr.role]="tipo() === 'erro' ? 'alert' : 'status'"
    aria-atomic="true" (mouseenter)="definirPausa('mouse', true)" (mouseleave)="definirPausa('mouse', false)"
    (focusin)="definirPausa('foco', true)" (focusout)="definirPausa('foco', false, $event)">
    <svg class="notificacao__icone" viewBox="0 0 24 24" width="24" height="24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (tipo() === 'sucesso') {
        <circle cx="12" cy="12" r="9" /><path d="m8 12 3 3 5-6" />
      } @else {
        <path d="M10.3 3.8 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z" />
        <path d="M12 9v4m0 4h.01" />
      }
    </svg>
    <div class="notificacao__conteudo" tabindex="0" aria-label="Mensagem da notificação">
      <p class="notificacao__mensagem">{{ mensagem() }}</p>
    </div>
    <button class="notificacao__fechar" type="button" aria-label="Fechar notificação" (click)="fecharAgora()">
      <span aria-hidden="true">&times;</span>
    </button>
    <div class="notificacao__trilha" aria-hidden="true">
      <div class="notificacao__progresso" [style.width.%]="progresso()"></div>
    </div>
  </aside>
}
