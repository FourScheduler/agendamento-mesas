@if (titulo() || mensagem()) {
  <aside class="toast" [class]="'toast toast--' + tipo()"
    [attr.role]="tipo() === 'erro' ? 'alert' : 'status'" aria-atomic="true"
    (mouseenter)="definirPausa('mouse', true)" (mouseleave)="definirPausa('mouse', false)"
    (focusin)="definirPausa('foco', true)" (focusout)="definirPausa('foco', false, $event)">
    <span class="toast__icone" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @switch (tipo()) {
          @case ('sucesso') { <path d="m6 12 4 4 8-9" /> }
          @case ('erro') { <path d="m7 7 10 10M7 17 17 7" /> }
          @case ('cancelamento') { <path d="m7 7 10 10M7 17 17 7" /> }
          @case ('aviso') { <path d="M12 6v8m0 4h.01" /> }
          @case ('info') { <path d="M12 11v7m0-12h.01" /> }
        }
      </svg>
    </span>
    <div class="toast__conteudo" tabindex="0" aria-label="Mensagem da notificação">
      @if (titulo()) { <p class="toast__titulo">{{ titulo() }}</p> }
      @if (mensagem()) { <p class="toast__mensagem">{{ mensagem() }}</p> }
    </div>
    <button class="toast__fechar" type="button" aria-label="Fechar notificação" (click)="fecharAgora()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m6 6 12 12M6 18 18 6" />
      </svg>
    </button>
      <div class="toast__trilha" aria-hidden="true">
        <div class="toast__progresso" [style.width.%]="progresso()"></div>
      </div>
  </aside>
}
