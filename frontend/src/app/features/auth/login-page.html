<main class="login-page">
  <section class="login cartao" aria-labelledby="titulo-login">
    <div class="cartao__cabecalho">
      <h2 id="titulo-login">Entre para acessar o Agendamento de Mesas</h2>
      <p>Use sua conta de demonstração para consultar as mesas.</p>
    </div>
    <form #form="ngForm" (ngSubmit)="entrar()">
      <div class="campo">
        <label class="campo__rotulo" for="email">E-mail</label>
        <input
          class="campo__entrada"
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          email
          autocomplete="username"
          [disabled]="entrando()"
          autofocus
        />
      </div>
      <div class="campo">
        <label class="campo__rotulo" for="senha">Senha</label>
        <input
          class="campo__entrada"
          id="senha"
          name="senha"
          type="password"
          [(ngModel)]="senha"
          required
          autocomplete="current-password"
          [disabled]="entrando()"
        />
      </div>
      @if (erro()) {
      <p role="alert" class="campo__erro">{{ erro() }}</p>
      }
      <button
        class="botao entrar"
        type="submit"
        [disabled]="form.invalid || entrando()"
      >
        {{ entrando() ? 'Entrando…' : 'Entrar e acessar agendamento' }}
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M5 12h14m-5-5 5 5-5 5" />
        </svg>
      </button>
    </form>
  </section>
</main>
